name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: Verify Python API (Ruff & Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/api-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies & run checks
        run: |
          uv sync
          uv run ruff check .
          uv run pytest

  verify-rust:
    name: Verify Rust Flash-Sale Engine (Cargo Check & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/engine-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/engine-rust
      - name: Run cargo check and cargo test
        run: |
          cargo check
          cargo test

  verify-kotlin:
    name: Verify Kotlin Mobile Domain & Manifest Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Run Kotlin Compile, Unit Tests & Manifest Guard
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin testDebugUnitTest checkMergedManifestPermissions
