[package]
name = "ge-shop-engine-rust"
version = "0.1.0"
edition = "2021"
description = "GE Shop High-Concurrency Flash-Sale & Atomic Stock Reservation Engine"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "net"] }
